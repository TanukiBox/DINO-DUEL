<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DINO DUEL 絵の確認</title>
<style>
  body { margin: 0; padding: 12px; background: #f4e6c8; font-family: sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .cell { background: #fff8e8; border: 2px solid #2b1b12; border-radius: 10px; padding: 6px; text-align: center; font-size: 12px; }
  .cell svg { width: 100%; height: auto; display: block; }
  .flip svg { transform: scaleX(-1); }
</style>
</head>
<body>
<p>全種の絵（右向き）・相手側（左右反転）・シルエット。<code>tools/art-preview.html</code> をブラウザで開くと見られる。</p>
<div class="grid" id="g"></div>
<script src="../js/game/config.js"></script>
<script src="../js/game/data.js"></script>
<script src="../js/game/art.js"></script>
<script>
  var g = document.getElementById('g');
  DN.DINOS.forEach(function (d) {
    g.insertAdjacentHTML('beforeend', '<div class="cell">' + DN.art.svg(d) + d.name.ja + '（' + d.art.type + '）</div>');
  });
  DN.DINOS.forEach(function (d) {
    g.insertAdjacentHTML('beforeend', '<div class="cell flip">' + DN.art.svg(d) + '相手側</div>');
  });
  DN.DINOS.slice(0, 4).forEach(function (d) {
    g.insertAdjacentHTML('beforeend', '<div class="cell">' + DN.art.svg(d, { silhouette: true }) + 'シルエット</div>');
  });
</script>
</body>
</html>
