<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DINO DUEL 絵の確認</title>
<style>
  body { margin: 0; padding: 12px; background: #f4e6c8; font-family: sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .cell { background: #fff8e8; border: 2px solid #2b1b12; border-radius: 10px; padding: 6px; text-align: center; font-size: 12px; }
  .cell svg { width: 100%; height: auto; display: block; }
  .flip svg { transform: scaleX(-1); }
</style>
</head>
<body>
<p>全種の絵（右向き）・相手側（左右反転）・シルエット。<code>tools/art-preview.html</code> をブラウザで開くと見られる。</p>
<div class="grid" id="g"></div>
<script src="../js/game/config.js"></script>
<script src="../js/game/data.js"></script>
<script src="../js/game/art.js"></script>
<script src="../js/game/art-kit.js"></script>
<script src="../js/game/art-tyranno.js"></script>
<script src="../js/game/art-raptor.js"></script>
<script src="../js/game/art-triceratops.js"></script>
<script src="../js/game/art-ankylo.js"></script>
<script src="../js/game/art-stego.js"></script>
<script src="../js/game/art-brachio.js"></script>
<script src="../js/game/art-iguano.js"></script>
<script src="../js/game/art-pterano.js"></script>
<script src="../js/game/art-elasmo.js"></script>
<script src="../js/game/art-theropods.js"></script>
<script src="../js/game/art-herbivores.js"></script>
<script src="../js/game/art-skysea.js"></script>
<script>
  var g = document.getElementById('g');
  var one = location.hash.slice(1);
  if (one === 'detail') {
    // 描きこみ版だけを2列で（動きを止めて）
    g.style.gridTemplateColumns = '1fr 1fr';
    DN.DINOS.filter(function (d) { return DN.ART_CUSTOM[d.id]; }).forEach(function (d) {
      g.insertAdjacentHTML('beforeend', '<div class="cell">' + DN.art.svg(d) + d.name.ja + '</div>');
    });
    document.querySelectorAll('[class^="p-"]').forEach(function (e) { e.style.animation = 'none'; });
  } else if (one && DN.dino(one)) {
    // 1体だけ大きく（例：art-preview.html#tyranno）。下は描きこむ前の型の絵
    var d1 = DN.dino(one);
    g.style.gridTemplateColumns = '1fr 1fr';
    g.insertAdjacentHTML('beforeend', '<div class="cell">' + DN.art.svg(d1) + '描きこみ版（手描き風の線＋自動の影）</div>');
    g.insertAdjacentHTML('beforeend', '<div class="cell">' + DN.art.svg(d1, { noInk: true, noAuto: true }) + '線と影の加工なし</div>');
    g.insertAdjacentHTML('beforeend', '<div class="cell" style="width:190px">' + DN.art.svg(d1) + 'ゲームの大きさ</div>');
    g.insertAdjacentHTML('beforeend', '<div class="cell" style="width:190px">' + DN.art.svg(d1, { noInk: true, noAuto: true }) + 'ゲームの大きさ（加工なし）</div>');
  } else {
  DN.DINOS.forEach(function (d) {
    g.insertAdjacentHTML('beforeend', '<div class="cell">' + DN.art.svg(d) + d.name.ja + '（' + d.art.type + '）</div>');
  });
  DN.DINOS.forEach(function (d) {
    g.insertAdjacentHTML('beforeend', '<div class="cell flip">' + DN.art.svg(d) + '相手側</div>');
  });
  DN.DINOS.slice(0, 4).forEach(function (d) {
    g.insertAdjacentHTML('beforeend', '<div class="cell">' + DN.art.svg(d, { silhouette: true }) + 'シルエット</div>');
  });
  }
</script>
</body>
</html>
