<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DINO DUEL／恐竜カードバトル</title>
<meta name="description" content="恐竜を集めて3体のチームを組み、タイミングよくタップして戦う3対3の恐竜カードバトル。ブラウザで無料で遊べます。">
<meta name="theme-color" content="#1d2440">
<!-- X などでリンクを貼ったときの表示 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tanuki Box">
<meta property="og:title" content="DINO DUEL／恐竜カードバトル">
<meta property="og:description" content="当たる瞬間にタップ！ 3体対3体の恐竜カードバトル。ブラウザで無料で遊べます。">
<meta property="og:url" content="https://tanukibox.github.io/DINO-DUEL/">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="DINO DUEL／恐竜カードバトル">
<meta name="twitter:description" content="当たる瞬間にタップ！ 3体対3体の恐竜カードバトル。ブラウザで無料で遊べます。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DINO DUEL">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&display=swap">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section id="title" class="screen">
    <div class="t-top sky">
      <h1 class="logo">DINO<br>DUEL</h1>
      <p class="t-sub" data-t="subtitle"></p>
      <div class="t-dinos" id="t-dinos"></div>
    </div>
    <div class="t-bottom">
      <ol class="howto">
        <li data-t="howto1"></li>
        <li data-t="howto2"></li>
        <li data-t="howto3"></li>
      </ol>
      <div class="lv-label" data-t="foeLevel"></div>
      <div class="lv-row" id="lv-row"></div>
      <button class="btn big" id="btn-start" data-t="start"></button>
      <div class="t-foot">
        <button class="btn small" id="btn-sound"></button>
        <span class="by">Tanuki Box</span>
      </div>
    </div>
  </section>

  <!-- バトル -->
  <section id="battle" class="screen">
    <div class="field sky" id="field">
      <div class="turn-badge" id="turn-badge"></div>
      <div class="lanes" id="lanes"></div>
      <div class="fx-layer" id="fx"></div>
    </div>
    <div class="order" id="order"></div>
    <div class="panel" id="panel"></div>
  </section>

  <!-- タイミングのタップを受けるための透明な板（攻撃・防御の輪が出ている間だけ） -->
  <div id="tapzone"></div>
</div>

<!-- Tanuki Box 共通土台 -->
<script src="js/common/tb-store.js?v=6"></script>
<script src="js/common/tb-i18n.js?v=6"></script>

<!-- DINO DUEL -->
<script src="js/game/config.js?v=6"></script>
<script src="js/game/data.js?v=6"></script>
<script src="js/game/lang.js?v=6"></script>
<script src="js/game/art.js?v=6"></script>
<script src="js/game/art-kit.js?v=6"></script>
<script src="js/game/art-tyranno.js?v=6"></script>
<script src="js/game/art-raptor.js?v=6"></script>
<script src="js/game/art-triceratops.js?v=6"></script>
<script src="js/game/art-ankylo.js?v=6"></script>
<script src="js/game/art-stego.js?v=6"></script>
<script src="js/game/art-brachio.js?v=6"></script>
<script src="js/game/art-iguano.js?v=6"></script>
<script src="js/game/art-pterano.js?v=6"></script>
<script src="js/game/art-elasmo.js?v=6"></script>
<script src="js/game/battle.js?v=6"></script>
<script src="js/game/sfx.js?v=6"></script>
<script src="js/game/share.js?v=6"></script>
<script src="js/game/anims.js?v=6"></script>
<script src="js/game/battle-view.js?v=6"></script>
<script src="js/game/main.js?v=6"></script>
</body>
</html>
